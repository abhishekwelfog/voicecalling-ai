<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Welfog AI Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #F8F9FA;
      --bg-card: #FFFFFF;
      --border-subtle: #E5E7EB;
      
      /* Executive Luxury Saffron & Black Palette */
      --brand-saffron: #FF5722;
      --brand-saffron-light: #FF6E40;
      --brand-saffron-hover: #F4511E;
      --brand-saffron-tint: #FFF4EE;
      --brand-saffron-border: #FED7AA;
      --brand-saffron-glow: rgba(255, 87, 34, 0.28);
      
      --text-dark: #0F172A;
      --text-muted: #64748B;
      
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(at 10% 10%, rgba(255, 87, 34, 0.05) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(255, 110, 64, 0.04) 0px, transparent 50%);
      color: var(--text-dark);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 44px 38px;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.02);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--brand-saffron-light) 0%, var(--brand-saffron) 100%);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand-icon-box {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--brand-saffron-light) 0%, var(--brand-saffron) 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 8px 22px var(--brand-saffron-glow);
    }

    .brand-icon-box svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-dark);
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .badge-admin {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: var(--brand-saffron-tint);
      border: 1px solid var(--brand-saffron-border);
      color: var(--brand-saffron);
      font-size: 11px;
      font-weight: 700;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #F8FAFC;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14px;
      color: var(--text-dark);
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      background: #FFFFFF;
      border-color: var(--brand-saffron);
      box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.18);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--brand-saffron-light) 0%, var(--brand-saffron) 100%);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 28px;
      box-shadow: 0 6px 22px var(--brand-saffron-glow);
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(255, 87, 34, 0.45);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-alert {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #DC2626;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .footer-note {
      text-align: center;
      margin-top: 26px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-note strong {
      color: var(--text-dark);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-icon-box">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.21 2.2z"/></svg>
        </div>
        <h1 class="brand-title">Welfog AI</h1>
        <p class="brand-subtitle">Autonomous Customer Voice &amp; Order Confirmation Platform</p>
        <div class="badge-admin">🔒 Administrator Portal</div>
      </div>

      <div id="errorAlert" class="error-alert"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <input type="text" id="username" required placeholder="Enter username" autocomplete="username" autofocus />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" required placeholder="Enter password" autocomplete="current-password" />
          </div>
        </div>

        <!-- Anti-Bot Honeypot Trap (invisible to humans, filled by spam bots) -->
        <div style="display:none !important; visibility:hidden; position:absolute; left:-9999px;" aria-hidden="true">
          <label for="trap">Security Verification</label>
          <input type="text" id="trap" name="trap" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <span>Sign In to Dashboard</span>
          <span>→</span>
        </button>
      </form>

      <div class="footer-note">
        Authorized Access Only &bull; <strong>Welfog Internet Pvt Ltd</strong>
      </div>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorAlert = document.getElementById('errorAlert');
      const btnSubmit = document.getElementById('btnSubmit');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const trap = document.getElementById('trap') ? document.getElementById('trap').value : '';

      errorAlert.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Verifying credentials...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, trap })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          btnSubmit.innerHTML = '<span>Login Successful! Redirecting...</span>';
          btnSubmit.style.background = '#059669';
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 350);
        } else {
          errorAlert.textContent = data.detail || 'Invalid username or password. Please try again.';
          errorAlert.style.display = 'block';
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<span>Sign In to Dashboard</span> <span>→</span>';
        }
      } catch (err) {
        errorAlert.textContent = 'Network error connecting to auth server: ' + err.message;
        errorAlert.style.display = 'block';
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Sign In to Dashboard</span> <span>→</span>';
      }
    }
  </script>
</body>
</html>
